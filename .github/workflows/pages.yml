name: Validar mural

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar, testar e auditar
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run check
          npm run build
          npm run security:check
        env:
          API_BASE_URL: https://api.example.invalid
